name: Gerar assets do perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: TomD4vs
          outputs: |
            dist/snake.svg?color_snake=#D96F4B&color_dots=#0C0C0D,#3a2018,#7a3823,#b05334,#D96F4B

      - name: Gerar o card de estatisticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/stats.mjs dist/stats.svg

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
