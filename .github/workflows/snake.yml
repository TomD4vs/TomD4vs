name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar a animacao
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: TomD4vs
          outputs: |
            dist/snake.svg?color_snake=#D96F4B&color_dots=#0C0C0D,#3a2018,#7a3823,#b05334,#D96F4B

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
